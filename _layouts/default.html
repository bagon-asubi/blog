<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script>
    (function () {
      const saved = localStorage.getItem("theme");
      if (saved === "light") {
        document.documentElement.classList.add("light-init");
      }
    })();
  </script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-title">
        <a href="{{ '/' | relative_url }}" style="color: inherit; text-decoration: none;">
          {{ site.title }}
        </a>
      </div>
      <div class="topbar-actions">
        <button type="button" id="themeToggle" class="btn-pill" aria-label="テーマ切替">
          Theme
        </button>
        <a href="{{ site.corp_url }}" target="_blank" rel="noopener noreferrer" class="btn-pill btn-accent">
          {{ site.corp_name }} ↗
        </a>
      </div>
    </header>

    <main>
      {{ content }}
    </main>

    <footer class="site-footer">
      <div>{{ site.title }} ({{ site.handle }}) · Powered by Jekyll &amp; GitHub Pages</div>
      <div style="margin-top: 4px;">
        <a href="{{ site.corp_url }}" target="_blank" rel="noopener noreferrer">{{ site.corp_name }} コーポレートサイト</a>
      </div>
    </footer>
  </div>

  <script>
    (function () {
      const btn = document.getElementById("themeToggle");
      const applyTheme = (mode) => {
        if (mode === "light") {
          document.body.classList.add("light-theme");
          btn.textContent = "Dark";
        } else {
          document.body.classList.remove("light-theme");
          btn.textContent = "Light";
        }
        localStorage.setItem("theme", mode);
      };
      const initial = localStorage.getItem("theme") || "dark";
      applyTheme(initial);
      btn.addEventListener("click", () => {
        const next = document.body.classList.contains("light-theme") ? "dark" : "light";
        applyTheme(next);
      });
    })();
  </script>
</body>
</html>
